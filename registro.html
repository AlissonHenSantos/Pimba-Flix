    <div class="margem-lateral" style="margin-top: 7rem;">
        <div id="crie-sua-conta" class="crie-sua-conta-box text-light">
            <div class="bem-vindo-crie-sua-conta py-4">
                <h1 class="bem-vindo">Bem-vindo ao Pimba Animes</h1>
            </div>
            
            <div class="crie-sua-conta">
                <h1 class="text-center" style="color: #ff730f;">Crie sua conta</h1>

                <!-- Direciona para index.html para simular criação de conta concluída -->
                <form method="get" action="index.html">
                    <div class="crie-sua-conta-item p-1 ps-5">
                        <label>Nome:</label>
                        <input name="nome" class="crie-sua-conta-input" type="text" required>
                    </div>
                    <div class="crie-sua-conta-item p-1 ps-5">
                        <label>Telefone:</label>
                        <input name="telefone" class="crie-sua-conta-input" type="tel" required>
                    </div>
                    <div class="crie-sua-conta-item p-1 ps-5">
                        <label>Email:</label>
                        <input name="email" class="crie-sua-conta-input" type="email" required>
                    </div>
                    <div class="crie-sua-conta-item p-1 ps-5">
                        <label>Nome do Perfil:</label>
                        <input name="perfilName" class="crie-sua-conta-input" type="text" required>
                    </div>
                    <div class="crie-sua-conta-item p-1 ps-5">
                        <label>Senha:</label>
                        <input id="senha" name="senha" class="crie-sua-conta-input" type="password" required>
                    </div>
                    <div class="crie-sua-conta-item p-1 ps-5">
                        <label>Confirme a senha:</label>
                        <input id="confirmar-senha" class="crie-sua-conta-input" type="password" required>
                    </div>

                    <div class="btn-criar-conta pt-4 pb-4">
                        <input class="criar-conta px-4" type="submit" value="CRIAR CONTA" name="Cadastrar">
                    </div>
                    <a href="login.html" class="form-link">Já tem uma conta? Entre</a>
                </form>
            </div>
        </div>
    </div>

    <!-- Script de validação de senha -->
    <script>
        var password = document.getElementById("senha"),
            confirm_password = document.getElementById("confirmar-senha");

        function validatePassword(){
            if(password.value != confirm_password.value) {
                confirm_password.setCustomValidity("Senhas diferentes!");
            } else {
                confirm_password.setCustomValidity('');
            }
        }

        password.onchange = validatePassword;
        confirm_password.onkeyup = validatePassword;
    </script>
